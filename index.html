<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a1628">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>深圳天气实景监测</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">LIVE</span>
                </div>
                <h1 class="camera-name" id="cameraName">福田东</h1>
                <div class="header-meta">
                    <span class="update-time" id="updateTime">--:--</span>
                </div>
            </div>
            <div class="header-accent"></div>
        </header>

        <!-- Video Container -->
        <main class="video-container">
            <div class="video-wrapper">
                <video
                    id="videoPlayer"
                    autoplay
                    playsinline
                    loop
                    muted
                    preload="auto"
                >
                    您的浏览器不支持 video 标签
                </video>

                <!-- Loading Overlay -->
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner">
                        <div class="spinner-ring"></div>
                        <div class="spinner-ring"></div>
                        <div class="spinner-ring"></div>
                    </div>
                    <span class="loading-text">加载视频中...</span>
                </div>

                <!-- Error Overlay -->
                <div class="error-overlay hidden" id="errorOverlay">
                    <div class="error-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                    <span class="error-text">视频加载失败</span>
                    <button class="retry-btn" id="retryBtn">重试</button>
                </div>

                <!-- Video Controls -->
                <div class="video-controls">
                    <button class="control-btn" id="playPauseBtn" title="播放/暂停">
                        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="fullscreenBtn" title="全屏">
                        <svg class="icon-fullscreen" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Camera Tabs -->
        <nav class="camera-tabs">
            <div class="tabs-scroll-container">
                <div class="tabs-track" id="tabsTrack">
                    <!-- Tabs will be generated by JS -->
                </div>
            </div>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
