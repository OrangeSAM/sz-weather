<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a1628">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>深圳天气实景监测</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">LIVE</span>
                </div>
                <h1 class="camera-name" id="cameraName">福田东</h1>
                <div class="header-meta">
                    <span class="update-time" id="updateTime">--:--</span>
                </div>
            </div>
            <div class="header-accent"></div>
        </header>

        <!-- Video Container -->
        <main class="video-container">
            <div class="video-wrapper">
                <video
                    id="videoPlayer"
                    autoplay
                    playsinline
                    loop
                    muted
                    preload="auto"
                >
                    您的浏览器不支持 video 标签
                </video>

                <!-- Loading Overlay -->
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner">
                        <div class="spinner-ring"></div>
                        <div class="spinner-ring"></div>
                        <div class="spinner-ring"></div>
                    </div>
                    <span class="loading-text">加载视频中...</span>
                </div>

                <!-- Error Overlay -->
                <div class="error-overlay hidden" id="errorOverlay">
                    <div class="error-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                    <span class="error-text">视频加载失败</span>
                    <button class="retry-btn" id="retryBtn">重试</button>
                </div>

                <!-- Video Controls -->
                <div class="video-controls">
                    <button class="control-btn" id="playPauseBtn" title="播放/暂停">
                        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="muteBtn" title="静音/取消静音">
                        <svg class="icon-volume-up" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                        <svg class="icon-muted hidden" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="fullscreenBtn" title="全屏">
                        <svg class="icon-fullscreen" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    </button>
                </div>

                <!-- Timestamp Badge -->
                <div class="timestamp-badge" id="timestampBadge">
                    <span class="timestamp-label">视频时间</span>
                    <span class="timestamp-value" id="timestampValue">--</span>
                </div>
            </div>
        </main>

        <!-- Camera Tabs -->
        <nav class="camera-tabs">
            <div class="tabs-scroll-container">
                <div class="tabs-track" id="tabsTrack">
                    <!-- Tabs will be generated by JS -->
                </div>
            </div>
            <div class="tabs-indicator">
                <div class="indicator-line" id="indicatorLine"></div>
            </div>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
